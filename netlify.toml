[build]
  command = "npm run build"
  publish = "dist"
  # Saves credits: only Publish/Links/Site commits deploy the live site. See scripts/deploy-check.sh
  ignore = "bash scripts/deploy-check.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The site moved to Cloudflare Pages at thelittlenest.blog (Nov 2026).
# Every old netlify.app address sends readers and Google to the same page on the new domain.
[[redirects]]
  from = "/*"
  to = "https://thelittlenest.blog/:splat"
  status = 301
  force = true
